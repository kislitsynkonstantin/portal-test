<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Портал Баня-МСК</title>
<style>
:root{--bg:#eceef1;--card:#fff;--ink:#0b0c0e;--mute:#6b7079;--blue:#0063f2}
@media (prefers-color-scheme:dark){:root{--bg:#020202;--card:#111214;--ink:#fff;--mute:#8b8f97;--blue:#2b7bff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.c{background:var(--card);border-radius:24px;padding:32px 36px;max-width:420px;margin:16px}
h1{font-size:22px;margin:0 0 8px}p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:8px}
</style></head><body><div class="c"><h1><i></i>Портал Баня-МСК</h1><p>Портал готовится. Вход — по аккаунту Баня-МСК.</p></div></body></html>
